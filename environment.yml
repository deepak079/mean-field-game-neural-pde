# Create with:  conda env create -f environment.yml && conda activate ams516-mfg
# Then:         pip install -e ".[dev]"
name: ams516-mfg
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - jupyterlab
  # PyTorch from conda-forge, not pip: pip's torch loads the system C++ library, which on older
  # Linux (e.g. Ubuntu 20.04) breaks conda's numpy. CPU build is enough for these 1-D problems;
  # see README for the GPU option.
  - pytorch-cpu
  - pip
